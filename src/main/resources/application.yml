spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  n8n:
    webhook-verificacion: ${N8N_WEBHOOK_VERIFICACION}
    webhook-bienvenida: ${N8N_WEBHOOK_BIENVENIDA}

  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:3000}