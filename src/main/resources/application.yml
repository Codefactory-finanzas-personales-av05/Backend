spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test}
    username: ${DB_USER:test}
    password: ${DB_PASS:test}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  address: 0.0.0.0

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  n8n:
    webhook-verificacion: ${N8N_WEBHOOK_VERIFICACION:http://localhost}
    webhook-bienvenida: ${N8N_WEBHOOK_BIENVENIDA:http://localhost}

  cors:
    origenes-permitidos: ${CORS_ORIGINS:http://localhost:3000}