spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  verificacion:
    minutos-expiracion: 15
    longitud-codigo: 6

  frontend-url: ${FRONTEND_URL}

  cors:
    origenes-permitidos: ${CORS_ORIGINS}

  n8n:
    webhook-verificacion: ${N8N_WEBHOOK_VERIFICACION}
    webhook-bienvenida: ${N8N_WEBHOOK_BIENVENIDA}

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true