spring:
  # Fuerza H2 en memoria para todas las pruebas
  # Se activa con @ActiveProfiles("test") en las clases de prueba
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: ClaveSecretaParaPruebasNoUsarEnProduccion!
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  verificacion:
    minutos-expiracion: 15
    longitud-codigo: 6

  frontend-url: http://localhost:3000

  cors:
    origenes-permitidos: http://localhost:3000

  # En pruebas los webhooks apuntan a localhost (no existe)
  # AdaptadorCorreo captura el error y continua normalmente
  n8n:
    webhook-verificacion: http://localhost:5678/webhook-test/verificacion-correo
    webhook-bienvenida: http://localhost:5678/webhook-test/bienvenida-correo
