name: CI/CD Pipeline




on:
  push:
    branches: [ "main", "feature/**" ]

jobs:
  tests:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        run: mvn clean test


# Sonar's Job
  sonar:
    # Depende del job de tests
    needs: tests

    name: SonarCloud analysis
    runs-on: ubuntu-latest

    steps:
      # Checkout del repo (OBLIGATORIO para que exista código)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # recomendado para SonarCloud

      # Set up JDK 17 (tu versión correcta)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache Maven
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Análisis SonarCloud
      - name: Analyze with SonarCloud
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORG }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.exclusions=**/FinanceAuthApplication.java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JWT_SECRET: "ClaveCI"
          N8N_WEBHOOK_VERIFICACION: "http://localhost/test"
          N8N_WEBHOOK_BIENVENIDA: "http://localhost/test"
          FRONTEND_URL: "http://localhost:3000"
          CORS_ORIGINS: "http://localhost:3000"

  # -------------------------
  # 3. BUILD JAR
  # -------------------------
  build:
    needs: sonar
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  # -------------------------
  # 4. DEPLOY EC2
  # -------------------------
  deploy:
    needs: build
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 1

      - name: Restart service in EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart auth
            sudo systemctl status auth --no-pager
