spring:
  # Desactivamos el correo real porque todavia no tenemos servidor SMTP
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  # ============================================================
  # BASE DE DATOS - MODO DESARROLLO (H2 en memoria)
  # Para cambiar a PostgreSQL, comentar este bloque
  # y descomentar el bloque de PostgreSQL de abajo
  # ============================================================
  datasource:
    url: jdbc:h2:mem:finanzasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # ============================================================
  # BASE DE DATOS - PRODUCCION (PostgreSQL)
  # Cuando tengan la BD lista, comentar el bloque H2 de arriba
  # y descomentar esto. Pedir al compañero de BD los datos.
  # ============================================================
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/finanzas_db
  #   driver-class-name: org.postgresql.Driver
  #   username: postgres
  #   password: tu_password
  #
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       format_sql: true
  #   database-platform: org.hibernate.dialect.PostgreSQLDialect

# Configuracion del JWT y codigos de verificacion
app:
  jwt:
    secret: MiClaveSecretaSuperSeguraParaFinanzasPersonales2024!
    expiration-ms: 86400000        # 24 horas en milisegundos
    refresh-expiration-ms: 604800000

  verificacion:
    minutos-expiracion: 15
    longitud-codigo: 6

  frontend-url: http://localhost:3000

server:
  port: 8080

logging:
  level:
    com.finanzas: DEBUG
    org.springframework.security: INFO
